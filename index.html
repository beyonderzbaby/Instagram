<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Instagram Analytics</title>

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafafa;
      color: #111;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px 18px;
    }

    .search {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .search input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      background: #111;
      color: white;
      font-weight: bold;
    }

    .profile {
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 20px;
    }
